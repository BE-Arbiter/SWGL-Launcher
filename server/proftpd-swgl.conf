# ==============================================================================
# SWGL — depot FTPS
# A deposer dans /etc/proftpd/conf.d/swgl.conf puis : systemctl reload proftpd
#
# Arborescence :
#   /srv/swgl/                  racine de swgl-dev
#     base/                     contenu commun a tous les canaux
#     manifest-public.json      manifeste du canal public
#     beta-<code>/              fichiers propres a une beta
#       manifest.json
#     beta-<code>.diff          journal de cette beta
#
#   /srv/swgl-jails/            dossiers VIDES servant de racine aux comptes lecture
#     swgl-public/
#     swgl-<code>/
#
# Comptes :
#   swgl-dev       lecture/ecriture sur tout /srv/swgl
#   swgl-public    lecture seule : voit / et /base
#   swgl-<code>    lecture seule : voit /, /base, /beta-<code> et /beta-<code>.diff
# ==============================================================================

ServerName            "SWGL"
ServerType            standalone

# Les comptes FTP n'ont pas de shell : sans cela ProFTPD refuserait la connexion.
RequireValidShell     off

DefaultRoot           ~
UseReverseDNS         off

# ---------- Prison virtuelle ----------
# mod_vroot remplace le chroot systeme par une prison geree par ProFTPD : c'est ce
# qui permet de faire apparaitre un dossier exterieur a l'interieur de la racine.
<IfModule mod_vroot.c>
  VRootEngine         on
  VRootOptions        allowSymlinks
</IfModule>

# ---------- TLS obligatoire ----------
# mod_tls vient du paquet proftpd-mod-crypto, pas de proftpd-core.
<IfModule mod_tls.c>
  TLSEngine                on
  TLSLog                   /var/log/proftpd/tls.log
  TLSProtocol              TLSv1.2 TLSv1.3
  TLSRSACertificateFile    /etc/proftpd/ssl/swgl.crt
  TLSRSACertificateKeyFile /etc/proftpd/ssl/swgl.key

  # Refuse le FTP en clair : mots de passe et donnees toujours chiffres.
  TLSRequired              on
  TLSVerifyClient          off

  # Indispensable : FluentFTP, donc le launcher, n'ouvre pas la connexion de
  # donnees en rejouant la session TLS du canal de controle.
  TLSOptions               NoSessionReuseRequired
</IfModule>

# ---------- Mode passif ----------
# Ouvrir la meme plage dans le pare-feu.
PassivePorts          49152 49200
# Derriere un NAT, decommenter avec l'adresse publique :
# MasqueradeAddress   vps-c2b14a7e.vps.ovh.net

# ---------- Ecriture interdite par defaut ----------
# Tout le monde est en lecture seule ; seul swgl-dev est reautorise plus bas.
<Limit WRITE>
  DenyAll
</Limit>

# ---------- Comptes ----------
# mod_ifsession est integre a proftpd-core : aucun LoadModule a ajouter.
<IfModule mod_ifsession.c>

  # Depot complet, en lecture/ecriture : c'est le compte de publication.
  <IfUser swgl-dev>
    DefaultRoot       /srv/swgl
    AllowOverwrite    on
    Umask             022 022

    <Limit WRITE>
      AllowAll
    </Limit>
  </IfUser>

  # Canal public : racine vide, base montee dedans.
  <IfUser swgl-public>
    DefaultRoot       /srv/swgl-jails/swgl-public
    VRootAlias        /srv/swgl/base                 base
    VRootAlias        /srv/swgl/manifest-public.json manifest.json
  </IfUser>

</IfModule>

# Un bloc par beta, genere par add-beta.sh
Include /etc/proftpd/conf.d/swgl-betas.conf
