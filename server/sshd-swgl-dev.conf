# /etc/ssh/sshd_config.d/swgl-dev.conf
# swgl-dev gets the swgl-sync prompt over SSH and nothing else: no shell, no
# SFTP/SCP, no tunnels.
Match User swgl-dev
    ForceCommand /usr/local/sbin/swgl-sync-ssh
    # /srv/swgl is swgl-dev's home and writable over FTP: never read keys there.
    # To switch to keys: /etc/ssh/authorized_keys/%u, then AuthenticationMethods publickey.
    AuthorizedKeysFile none
    PermitTTY yes
    DisableForwarding yes
    PermitUserRC no
