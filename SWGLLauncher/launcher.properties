# SWGL Launcher — paths are relative to the exe, colours are #RRGGBB or #AARRGGBB

# ---------- Window ----------
window.title=Star Wars: Galactic Legacy
window.width=960
window.height=540
window.corner.radius=14

# ---------- Music ----------
music.enabled=true
music.loop=true
# 0 to 100
music.volume=60

# ---------- Title bar ----------
titlebar.button.size=34
titlebar.button.color=#E8B923
titlebar.button.hover.color=#FFFFFF
titlebar.button.hover.background=#40FFFFFF
titlebar.close.hover.background=#C0C03030

# ---------- Interface ----------
ui.accent.color=#E8B923

# ---------- Updates ----------
sync.enabled=true
# check only, no download
sync.check.on.start=true
# "." = the launcher folder (GameData)
install.path=.
state.file=installed.json
# delete anything not listed in the manifest
sync.remove.unknown=true
# never deleted: game folder and stock Jedi Academy files; "*" stays in a folder, "**" crosses
sync.keep=base/**,EaxMan.dll,IFC22.dll,OpenAL32.dll,SWGLLauncher.exe,jagamex86.dll,jamp.exe,jasp.exe,launcher.properties,version.inf

# ---------- FTP ----------
ftp.host=93.127.203.21
ftp.port=21
manifest.file=/manifest.json
ftp.public.user=swgl-public
ftp.public.password=swgl-public
# beta account = <prefix><code>, password = code
ftp.beta.user.prefix=swgl-
# explicit | implicit | auto | none
ftp.tls=explicit
# needed for a self-signed certificate
ftp.accept.any.certificate=true
ftp.timeout.ms=15000

# ---------- Game (Start button) ----------
game.executable=SWGL_SP.x86_64.exe
game.arguments=
game.close.launcher=true

# ---------- Options menu ----------
jo.path=
# empty = found through the registry
steam.path=
steam.shortcuts.file=
steam.shortcut.name=STAR WARS™: Galactic Legacy

# ---------- Channel (written by the launcher) ----------
beta.codes=
channel.selected=
