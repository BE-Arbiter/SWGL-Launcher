# Publishes a launcher release when a version tag is pushed:
#
#   git tag v0.2.0-alpha
#   git push origin v0.2.0-alpha
#
# The launcher checks the latest release at startup and replaces itself with its
# SWGLLauncher.exe. SWGLLauncher.zip is for new installs (exe + SWGL folder).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish SWGLLauncher/SWGLLauncher.csproj -c Release -o publish "-p:Version=$version"

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/SWGLLauncher.exe, publish/SWGL -DestinationPath SWGLLauncher.zip

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" publish/SWGLLauncher.exe SWGLLauncher.zip `
            --title "${{ github.ref_name }}" --generate-notes
